services:
  moomoo-opend:
    image: stock-trader-opend:latest
    build:
      context: ./opend
      dockerfile: Dockerfile.opend
      args:
        OPEND_SHA256: "${OPEND_SHA256:-3ef44baf08f894a3d46c23ed784c7134d963e0d063c674f4384f7a8f99f58642}"
    container_name: stock_moomoo_opend
    restart: unless-stopped
    networks:
      - stock_network
    volumes:
      - opend_session_data:/root/.com.moomoo.OpenD
    environment:
      - MOOMOO_LOGIN_ACCOUNT=${MOOMOO_LOGIN_ACCOUNT:-}
      - MOOMOO_LOGIN_PWD_MD5=${MOOMOO_LOGIN_PWD_MD5:-}
      - TZ=America/New_York
    # Strictly isolated: No host port publication (ports:) - access only via internal bridge network.
    # Outbound egress enabled for Moomoo broker gateway authentication.

  screener-daemon:
    image: stock-trader-screener:latest
    build:
      context: ./screener
      dockerfile: Dockerfile.screener
    container_name: stock_screener_daemon
    restart: unless-stopped
    networks:
      - stock_network
    volumes:
      - shared_trading_data:/app/shared_data
      - opend_session_data:/opend_session_data:ro
    environment:
      - MOOMOO_OPEND_HOST=moomoo-opend
      - MOOMOO_OPEND_PORT=11111
      - SHARED_DATA_DIR=/app/shared_data
      - OPEND_SESSION_DATA_DIR=/opend_session_data
      - SCAN_INTERVAL_SECONDS=300
      - TZ=America/New_York
    depends_on:
      - moomoo-opend

  mcp-bridge:
    image: stock-trader-bridge:latest
    build:
      context: ./bridge
      dockerfile: Dockerfile.bridge
    container_name: stock_mcp_bridge
    restart: unless-stopped
    networks:
      - stock_network
    ports:
      # Bound exclusively to host loopback for Paperclip agent communication
      - "127.0.0.1:${BRIDGE_HOST_PORT:-8005}:8000"
    volumes:
      - shared_trading_data:/app/shared_data
      - opend_session_data:/opend_session_data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MOOMOO_OPEND_HOST=moomoo-opend
      - MOOMOO_OPEND_PORT=11111
      - MOOMOO_TELNET_PORT=22222
      - MOOMOO_TRD_ENV=${MOOMOO_TRD_ENV:-SIMULATE}
      - OPEND_SESSION_DATA_DIR=/opend_session_data
      - OPEND_CONTAINER_NAME=stock_moomoo_opend
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      - PAPERCLIP_BRIDGE_SECRET=${PAPERCLIP_BRIDGE_SECRET:?PAPERCLIP_BRIDGE_SECRET is required}
      - BRIDGE_SERVICE_TOKEN=${BRIDGE_SERVICE_TOKEN:?BRIDGE_SERVICE_TOKEN is required}
      - SHARED_DATA_DIR=/app/shared_data
      - TZ=America/New_York
    depends_on:
      - moomoo-opend

  trading-dashboard:
    image: stock_trader-trading-dashboard:latest
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dashboard
    container_name: stock_trading_dashboard
    restart: unless-stopped
    networks:
      - stock_network
      - npm_default
    volumes:
      - shared_trading_data:/app/shared_data
    environment:
      - PORT=3000
      - SHARED_DATA_DIR=/app/shared_data
      - BRIDGE_SERVICE_TOKEN=${BRIDGE_SERVICE_TOKEN:?BRIDGE_SERVICE_TOKEN is required}
      - BRIDGE_URL=${BRIDGE_URL:-http://mcp-bridge:8000}
      - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID:?AUTHENTIK_CLIENT_ID is required}
      - AUTHENTIK_ISSUER_URL=${AUTHENTIK_ISSUER_URL:-https://auth.julietmike.net/application/o/stock-trader/}
      - AUTHENTIK_JWKS_URL=${AUTHENTIK_JWKS_URL:-https://auth.julietmike.net/application/o/stock-trader/jwks/}
      - AUTHENTIK_LOGOUT_URL=${AUTHENTIK_LOGOUT_URL:-https://auth.julietmike.net/if/flow/stock-trader-invalidation-flow/}
      - FORWARD_AUTH_SECRET=${FORWARD_AUTH_SECRET:-}
      - TZ=America/New_York

  trading-dashboard-beta:
    image: stock_trader-trading-dashboard-beta:latest
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dashboard
    container_name: stock_trading_dashboard_beta
    restart: unless-stopped
    networks:
      - stock_network
      - npm_default
    volumes:
      - shared_trading_data:/app/shared_data
    environment:
      - PORT=3000
      - SHARED_DATA_DIR=/app/shared_data
      - BRIDGE_SERVICE_TOKEN=${BRIDGE_SERVICE_TOKEN:-}
      - BRIDGE_URL=${BRIDGE_URL:-http://mcp-bridge:8000}
      - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID:-stock-trader}
      - DISABLE_AUTHENTIK_AUTH=true
      - TZ=America/New_York

networks:
  # Standard bridge network enabling egress for OpenD and host loopback port mapping for MCP bridge
  stock_network:
    driver: bridge
  npm_default:
    external: true

volumes:
  opend_session_data:
  shared_trading_data:
